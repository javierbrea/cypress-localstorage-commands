name: build
on:
  push:
    branches:
      - master
      - release
  pull_request:
concurrency:  
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22.23.3", "24.21.0", "26.10.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Extract branch name
        shell: bash
        run: echo "branch=$(echo ${GITHUB_REF##*/})" >> $GITHUB_OUTPUT
        id: extract-branch
      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: pnpm install
      - name: Check spelling
        if: ${{ matrix.node == '24.21.0' }}
        run: pnpm run cspell
      - name: Lint
        if: ${{ matrix.node == '24.21.0' }}
        run: pnpm run lint
      - name: Check types
        if: ${{ matrix.node == '24.21.0' }}
        run: pnpm run tsc
      - name: Test unit
        run: pnpm run test:unit
      - name: Test mutation
        if: ${{ matrix.node == '24.21.0' }}
        run: pnpm run test:mutation
        env:
          BRANCH_NAME: ${{ steps.extract-branch.outputs.branch }}
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_TOKEN }}
      - name: Test E2E
        run: pnpm run test:e2e
        id: test-e2e
      - name: Upload E2E tests screenshots
        if: ${{ always() && steps.test-e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-screenshots-${{ matrix.node }}
          path: test-e2e/cypress-*/cypress/screenshots
          retention-days: 7
      - name: Upload test results
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-${{ matrix.node }}
          path: coverage
          retention-days: 1
  quality:
    runs-on: ubuntu-latest
    needs: test
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Download test results
        uses: actions/download-artifact@v8.0.1
        with:
          name: coverage-22.23.3
          path: coverage
      - name: Coveralls
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
